<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 420" font-family="'Microsoft YaHei','SimHei','Consolas',monospace">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#475569"/>
    </marker>
    <marker id="arrow-dash" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#94A3B8"/>
    </marker>
    <linearGradient id="appGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E0F2FE"/>
      <stop offset="100%" stop-color="#BAE6FD"/>
    </linearGradient>
    <linearGradient id="modGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
    <linearGradient id="coreGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FEF3C7"/>
      <stop offset="100%" stop-color="#FDE68A"/>
    </linearGradient>
    <style>
      .mod-name { font-size: 13px; font-weight: 700; fill: #1E293B; }
      .mod-desc { font-size: 10.5px; fill: #475569; }
      .hint { font-size: 10px; fill: #64748B; }
    </style>
  </defs>
  <rect width="880" height="420" fill="#FAFAFA"/>

  <!-- jieqi-app -->
  <rect x="360" y="24" width="160" height="52" rx="6" fill="url(#appGrad)" stroke="#38BDF8" stroke-width="1.5"/>
  <text x="440" y="46" text-anchor="middle" class="mod-name">jieqi-app</text>
  <text x="440" y="64" text-anchor="middle" class="mod-desc">启动入口 · Fat JAR</text>

  <!-- connectors app -> modules -->
  <path d="M 440 76 L 440 98" fill="none" stroke="#475569" marker-end="url(#arrow)"/>
  <path d="M 440 98 L 130 98 L 130 118" fill="none" stroke="#475569" marker-end="url(#arrow)"/>
  <path d="M 440 98 L 330 98 L 330 118" fill="none" stroke="#475569" marker-end="url(#arrow)"/>
  <path d="M 440 98 L 550 98 L 550 118" fill="none" stroke="#475569" marker-end="url(#arrow)"/>
  <path d="M 440 98 L 750 98 L 750 118" fill="none" stroke="#475569" stroke-dasharray="5,4" marker-end="url(#arrow-dash)"/>

  <!-- four modules - equal width boxes -->
  <g id="jieqi-server">
    <rect x="50" y="118" width="160" height="78" rx="6" fill="url(#modGrad)" stroke="#94A3B8"/>
    <text x="130" y="142" text-anchor="middle" class="mod-name">jieqi-server</text>
    <text x="130" y="162" text-anchor="middle" class="mod-desc">WS 8887</text>
    <text x="130" y="178" text-anchor="middle" class="mod-desc">TCP 8888</text>
  </g>
  <g id="jieqi-client">
    <rect x="250" y="118" width="160" height="78" rx="6" fill="url(#modGrad)" stroke="#94A3B8"/>
    <text x="330" y="142" text-anchor="middle" class="mod-name">jieqi-client</text>
    <text x="330" y="162" text-anchor="middle" class="mod-desc">控制台交互</text>
    <text x="330" y="178" text-anchor="middle" class="mod-desc">ConsoleUI</text>
  </g>
  <g id="jieqi-ai">
    <rect x="450" y="118" width="160" height="78" rx="6" fill="url(#modGrad)" stroke="#94A3B8"/>
    <text x="530" y="142" text-anchor="middle" class="mod-name">jieqi-ai</text>
    <text x="530" y="162" text-anchor="middle" class="mod-desc">搜索 · 评估</text>
    <text x="530" y="178" text-anchor="middle" class="mod-desc">三档 Bot</text>
  </g>
  <g id="jieqi-web">
    <rect x="670" y="118" width="160" height="78" rx="6" fill="url(#modGrad)" stroke="#CBD5E1" stroke-dasharray="6,3"/>
    <text x="750" y="142" text-anchor="middle" class="mod-name">jieqi-web</text>
    <text x="750" y="162" text-anchor="middle" class="mod-desc">Vue 3 前端</text>
    <text x="750" y="178" text-anchor="middle" class="mod-desc">Vite 5173</text>
  </g>

  <!-- merge to core -->
  <path d="M 130 196 L 130 228 L 440 228 L 440 248" fill="none" stroke="#475569" marker-end="url(#arrow)"/>
  <path d="M 330 196 L 330 228" fill="none" stroke="#475569"/>
  <path d="M 530 196 L 530 228" fill="none" stroke="#475569"/>
  <text x="750" y="210" text-anchor="middle" class="hint">独立前端（协议对接 server）</text>

  <!-- jieqi-core -->
  <rect x="340" y="248" width="200" height="64" rx="6" fill="url(#coreGrad)" stroke="#F59E0B" stroke-width="1.5"/>
  <text x="440" y="274" text-anchor="middle" class="mod-name">jieqi-core</text>
  <text x="440" y="294" text-anchor="middle" class="mod-desc">规则 · 棋谱 · 协议（领域核心）</text>

  <!-- legend -->
  <line x1="50" y1="340" x2="90" y2="340" stroke="#475569" marker-end="url(#arrow)"/>
  <text x="98" y="344" class="hint">Maven 依赖</text>
  <line x1="200" y1="340" x2="240" y2="340" stroke="#94A3B8" stroke-dasharray="5,4" marker-end="url(#arrow-dash)"/>
  <text x="248" y="344" class="hint">运行时 WebSocket 对接（非 Maven 依赖）</text>
  <text x="440" y="378" text-anchor="middle" class="hint">依赖方向：core ← server / client / ai ← app；web 经 WS 连接 server</text>
</svg>