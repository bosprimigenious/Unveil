<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 915" font-family="'Microsoft YaHei','SimHei',sans-serif">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#333"/>
    </marker>
    <linearGradient id="layerGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFF9E8"/>
      <stop offset="100%" stop-color="#FFF3CC"/>
    </linearGradient>
    <linearGradient id="compGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F3EFFF"/>
      <stop offset="100%" stop-color="#E8DEFF"/>
    </linearGradient>
    <style>
      .title { font-size: 18px; font-weight: 700; fill: #222; }
      .layer-title { font-size: 15px; font-weight: 700; fill: #333; }
      .comp-name { font-size: 13px; font-weight: 600; fill: #222; }
      .comp-pattern { font-size: 11px; fill: #555; }
      .flow-label { font-size: 11px; fill: #666; font-style: italic; }
      .legend { font-size: 11px; fill: #444; }
    </style>
  </defs>
  <rect width="820" height="915" fill="#FAFAFA"/>
  <text x="410" y="32" text-anchor="middle" class="title">通信层设计模式 — 纵向调用链</text>
  <g transform="translate(40,48)">
    <rect x="0" y="0" width="740" height="36" rx="6" fill="#FFF" stroke="#DDD"/>
    <text x="20" y="23" class="legend">策略</text>
    <text x="90" y="23" class="legend">单例</text>
    <text x="160" y="23" class="legend">命令</text>
    <text x="230" y="23" class="legend">外观</text>
    <text x="300" y="23" class="legend">工厂</text>
    <text x="370" y="23" class="legend">纯虚构</text>
    <text x="450" y="23" class="legend">观察者</text>
    <text x="530" y="23" class="legend">状态</text>
    <text x="600" y="23" class="legend" fill="#888">设计模式标注</text>
  </g>
  <g transform="translate(60,105)">
