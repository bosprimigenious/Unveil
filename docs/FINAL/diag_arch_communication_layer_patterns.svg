    <rect x="80" y="48" width="220" height="52" rx="5" fill="url(#compGrad)" stroke="#7B68B8"/>
    <text x="190" y="70" text-anchor="middle" class="comp-name">JieqiWebSocketServer</text>
    <text x="190" y="88" text-anchor="middle" class="comp-pattern">单例模式 · 唯一服务实例</text>
    <rect x="400" y="48" width="220" height="52" rx="5" fill="url(#compGrad)" stroke="#7B68B8"/>
    <text x="510" y="70" text-anchor="middle" class="comp-name">WebSocketService</text>
