  <g transform="translate(60,735)">
    <rect x="0" y="0" width="700" height="155" rx="8" fill="url(#layerGrad)" stroke="#C9A227" stroke-width="1.5"/>
    <text x="350" y="26" text-anchor="middle" class="layer-title">④ 数据持久层 — 走子命令与棋谱存储</text>
    <rect x="275" y="40" width="150" height="42" rx="5" fill="url(#compGrad)" stroke="#7B68B8"/>
    <text x="350" y="58" text-anchor="middle" class="comp-name">ICommand</text>
    <text x="350" y="74" text-anchor="middle" class="comp-pattern">命令模式</text>
    <line x1="350" y1="82" x2="350" y2="92" stroke="#333" marker-end="url(#arrow)"/>
    <rect x="275" y="92" width="150" height="34" rx="5" fill="url(#compGrad)" stroke="#7B68B8"/>
    <text x="350" y="113" text-anchor="middle" class="comp-name">MoveCommand</text>
    <line x1="350" y1="126" x2="350" y2="136" stroke="#333" marker-end="url(#arrow)"/>
    <ellipse cx="350" cy="146" rx="52" ry="9" fill="#D4E8FF" stroke="#5A8FBD"/>
    <rect x="298" y="136" width="104" height="18" fill="#D4E8FF" stroke="none"/>
    <ellipse cx="350" cy="136" rx="52" ry="9" fill="#E8F4FF" stroke="#5A8FBD"/>
    <ellipse cx="350" cy="154" rx="52" ry="9" fill="#D4E8FF" stroke="#5A8FBD"/>
    <text x="350" y="151" text-anchor="middle" font-size="12" font-weight="600" fill="#333">棋谱记录</text>
