    <text x="350" y="78" text-anchor="middle" class="comp-pattern">外观模式 / 纯虚构</text>
    <rect x="80" y="108" width="170" height="48" rx="5" fill="url(#compGrad)" stroke="#7B68B8"/>
    <text x="165" y="128" text-anchor="middle" class="comp-name">RoomManager</text>
    <text x="165" y="146" text-anchor="middle" class="comp-pattern">单例模式</text>
    <rect x="450" y="108" width="170" height="48" rx="5" fill="url(#compGrad)" stroke="#7B68B8"/>
    <text x="535" y="128" text-anchor="middle" class="comp-name">Game</text>
    <text x="535" y="146" text-anchor="middle" class="comp-pattern">状态模式 / 观察者模式</text>
    <line x1="350" y1="88" x2="165" y2="108" stroke="#333"/>
    <line x1="350" y1="88" x2="535" y2="108" stroke="#333"/>
    <rect x="120" y="178" width="150" height="44" rx="5" fill="url(#compGrad)" stroke="#7B68B8"/>
    <text x="195" y="205" text-anchor="middle" class="comp-name">ChessBoard</text>
    <rect x="430" y="178" width="150" height="44" rx="5" fill="url(#compGrad)" stroke="#7B68B8"/>
    <text x="505" y="198" text-anchor="middle" class="comp-name">IAIStrategy</text>
    <text x="505" y="214" text-anchor="middle" class="comp-pattern">策略模式</text>
    <rect x="120" y="232" width="150" height="44" rx="5" fill="url(#compGrad)" stroke="#7B68B8"/>
    <text x="195" y="252" text-anchor="middle" class="comp-name">ChessPiece</text>
    <text x="195" y="268" text-anchor="middle" class="comp-pattern">工厂模式</text>
    <line x1="535" y1="156" x2="195" y2="178" stroke="#333"/>
    <line x1="535" y1="156" x2="505" y2="178" stroke="#333"/>
    <line x1="195" y1="222" x2="195" y2="232" stroke="#333"/>
    <line x1="350" y1="250" x2="350" y2="275" stroke="#333" marker-end="url(#arrow)"/>
    <text x="365" y="268" class="flow-label">落盘棋谱</text>
