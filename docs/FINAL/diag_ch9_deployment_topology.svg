<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 28 920 512" font-family="'Microsoft YaHei','SimHei',sans-serif">
  <defs>
    <marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#475569"/></marker>
    <marker id="ad" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#94A3B8"/></marker>
    <linearGradient id="srv" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#E0F2FE"/><stop offset="100%" stop-color="#BAE6FD"/></linearGradient>
  </defs>
  <rect width="920" height="540" fill="#FAFAFA"/>

  <!-- server hub -->
  <rect x="310" y="48" width="300" height="72" rx="8" fill="url(#srv)" stroke="#0EA5E9" stroke-width="1.5"/>
  <text x="460" y="72" text-anchor="middle" font-size="14" font-weight="700" fill="#0C4A6E">jieqi-app · Fat JAR</text>
  <text x="460" y="92" text-anchor="middle" font-size="11" fill="#0369A1">server-ws 8887  │  server 8888 (TCP 可选)</text>
  <text x="460" y="110" text-anchor="middle" font-size="10" fill="#64748B">WsGameServer = 唯一规则权威</text>

  <!-- clients row -->
  <path d="M 460 120 L 460 148" stroke="#475569" marker-end="url(#a)"/>
  <path d="M 460 148 L 130 148 L 130 168" stroke="#475569" marker-end="url(#a)"/>
  <path d="M 460 148 L 330 148 L 330 168" stroke="#475569" marker-end="url(#a)"/>
  <path d="M 460 148 L 590 148 L 590 168" stroke="#475569" marker-end="url(#a)"/>
  <path d="M 460 148 L 790 148 L 790 168" stroke="#94A3B8" stroke-dasharray="5,4" marker-end="url(#ad)"/>

  <rect x="50" y="168" width="160" height="70" rx="6" fill="#F8FAFC" stroke="#94A3B8"/>
  <text x="130" y="192" text-anchor="middle" font-size="12" font-weight="600" fill="#334155">jieqi-client</text>
  <text x="130" y="212" text-anchor="middle" font-size="10" fill="#64748B">控制台交互</text>
  <text x="130" y="228" text-anchor="middle" font-size="10" fill="#64748B">match / move / replay</text>

  <rect x="250" y="168" width="160" height="70" rx="6" fill="#F8FAFC" stroke="#94A3B8"/>
  <text x="330" y="192" text-anchor="middle" font-size="12" font-weight="600" fill="#334155">jieqi-web</text>
  <text x="330" y="212" text-anchor="middle" font-size="10" fill="#64748B">Vue 3 · Vite</text>
  <text x="330" y="228" text-anchor="middle" font-size="10" fill="#64748B">HTTP 5173 + WS 8887</text>

  <rect x="510" y="168" width="160" height="70" rx="6" fill="#F8FAFC" stroke="#94A3B8"/>
  <text x="590" y="192" text-anchor="middle" font-size="12" font-weight="600" fill="#334155">组间客户端</text>
  <text x="590" y="212" text-anchor="middle" font-size="10" fill="#64748B">INTERFACE v3.1</text>
  <text x="590" y="228" text-anchor="middle" font-size="10" fill="#64748B">ws://host:8887</text>

  <rect x="710" y="168" width="160" height="70" rx="6" fill="#F8FAFC" stroke="#CBD5E1" stroke-dasharray="6,3"/>
  <text x="790" y="192" text-anchor="middle" font-size="12" font-weight="600" fill="#64748B">TCP Client</text>
  <text x="790" y="212" text-anchor="middle" font-size="10" fill="#94A3B8">附录 B 调试</text>
  <text x="790" y="228" text-anchor="middle" font-size="10" fill="#94A3B8">端口 8888</text>

  <!-- storage -->
  <path d="M 460 120 L 460 260 L 460 278" stroke="#475569" marker-end="url(#a)"/>
  <ellipse cx="460" cy="300" rx="70" ry="12" fill="#D4E8FF" stroke="#5A8FBD"/>
  <rect x="390" y="288" width="140" height="22" fill="#D4E8FF" stroke="none"/>
  <ellipse cx="460" cy="288" rx="70" ry="12" fill="#E8F4FF" stroke="#5A8FBD"/>
  <text x="460" y="304" text-anchor="middle" font-size="11" font-weight="600" fill="#334155">records/</text>
  <text x="460" y="328" text-anchor="middle" font-size="10" fill="#64748B">*.jieqi 棋谱 · *.replay.json 复盘</text>

  <!-- three scenarios -->
  <text x="40" y="368" font-size="13" font-weight="700" fill="#334155">三种部署场景</text>

  <rect x="40" y="380" width="260" height="130" rx="8" fill="#FFF" stroke="#4ADE80"/>
  <text x="170" y="404" text-anchor="middle" font-size="12" font-weight="700" fill="#166534">本地开发 / 答辩</text>
  <text x="60" y="426" font-size="10" fill="#14532D">dev-server.ps1 8887</text>
  <text x="60" y="444" font-size="10" fill="#14532D">verify.ps1 自检</text>
  <text x="60" y="462" font-size="10" fill="#14532D">demo.ps1 三窗口演示</text>
  <text x="60" y="480" font-size="10" fill="#14532D">npm run dev → 5173</text>
  <text x="60" y="498" font-size="9" fill="#16A34A">推荐 · WS + TCP + 全菜单</text>

  <rect x="330" y="380" width="260" height="130" rx="8" fill="#FFF" stroke="#38BDF8"/>
  <text x="460" y="404" text-anchor="middle" font-size="12" font-weight="700" fill="#0369A1">Docker 容器</text>
  <text x="350" y="426" font-size="10" fill="#0C4A6E">docker compose up --build</text>
  <text x="350" y="444" font-size="10" fill="#0C4A6E">仅映射 WS 8887</text>
  <text x="350" y="462" font-size="10" fill="#0C4A6E">maven build → JRE 21 run</text>
  <text x="350" y="480" font-size="10" fill="#0C4A6E">无 JDK 验收机适用</text>
  <text x="350" y="498" font-size="9" fill="#0284C7">实验性 · 不含 Web 前端</text>

  <rect x="620" y="380" width="260" height="130" rx="8" fill="#FFF" stroke="#F59E0B"/>
  <text x="750" y="404" text-anchor="middle" font-size="12" font-weight="700" fill="#92400E">一键演示流程</text>
  <text x="640" y="426" font-size="10" fill="#78350F">终端1: server-ws 8887</text>
  <text x="640" y="444" font-size="10" fill="#78350F">终端2: client-ws player1</text>
  <text x="640" y="462" font-size="10" fill="#78350F">终端3: client-ws player2</text>
  <text x="640" y="480" font-size="10" fill="#78350F">match → ready → move → replay</text>
  <text x="640" y="498" font-size="9" fill="#D97706">8 分钟答辩标准路径</text>
</svg>